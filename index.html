<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI SHOP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .banner {
            background-color: #87ceeb;
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 15px;
        }

        .banner h1 {
            font-weight: bold;
        }

        .product-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px gray;
        }

        .product-card img {
            height: 200px;
            object-fit: cover;
        }

        .price {
            color: red;
            font-weight: bold;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h2>MINI SHOP</h2>
    </header>

    <!-- MENU -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#sanpham">Sản phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#footer">Liên hệ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- BANNER -->
    <div class="container mt-4">
        <div class="banner">
            <h1>Chào mừng đến Mini Shop!</h1>
            <p>Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
            <a href="#sanpham" class="btn btn-primary">
                Xem sản phẩm
            </a>
        </div>
    </div>

    <!-- SẢN PHẨM -->
    <div class="container mt-5" id="sanpham">
       <h2 class="text-center mb-4">SẢN PHẨM NỔI BẬT</h2>

        <div class="row g-4">

            <div class="col-md-3 col-sm-6">
                <div class="card product-card">
                    <img src="images/áo thun.jpg" alt="Áo thun">
                    <div class="card-body text-center">
                        <h5>Áo thun</h5>
                        <p class="price">150.000đ</p>
                        <button class="btn btn-primary">Mua ngay</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card product-card">
                    <img src="images/giày.jpg" alt="Giày">
                    <div class="card-body text-center">
                        <h5>Giày thể thao</h5>
                        <p class="price">350.000đ</p>
                        <button class="btn btn-primary">Mua ngay</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card product-card">
                    <img src="images/áo khoác.jpg" alt="Áo khoác">
                    <div class="card-body text-center">
                        <h5>Áo khoác</h5>
                        <p class="price">200.000đ</p>
                        <button class="btn btn-primary">Mua ngay</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card product-card">
                    <img src="images/quần.jpg" alt="Quần jeans">
                    <div class="card-body text-center">
                        <h5>Quần jeans</h5>
                        <p class="price">250.000đ</p>
                        <button class="btn btn-primary">Mua ngay</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer id="footer">
        <p> 2026 Mini shop- thiết kế bảng Bootstrap 5</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
